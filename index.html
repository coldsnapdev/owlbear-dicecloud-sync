<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiceCloud Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b222b;
        --ink-soft: #6b7280;
        --paper: #fbfcfc;
        --line: #d8dde0;
        --brass: #8f6526;
        --ok: #2f6b4a;
        --error: #8f3a26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 10px 12px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
      h1 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--brass); margin: 0; }
      .build { font-size: 11px; color: var(--ink-soft); }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--brass); margin: 0 0 2px; }
      h3 { font-size: 12px; margin: 0 0 4px; color: var(--ink); }
      .open-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
      #dm-panel-link { font-size: 13px; font-weight: 600; padding: 7px 14px; }
      .block { margin-bottom: 8px; }
      .hint { color: var(--ink-soft); margin: 0 0 4px; font-size: 12px; }
      .foot { margin: 10px 0 0; opacity: .6; font-size: 11px; }
      input[type="text"], input[type="password"] {
        width: 100%; min-width: 0;
        padding: 5px 7px;
        margin-bottom: 4px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
        background: white;
        color: var(--ink);
      }
      .row input[type="text"] { margin-bottom: 0; flex: 1; }
      button { padding: 5px 10px; border: 1px solid var(--brass); background: var(--brass); color: white; border-radius: 4px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
      button:hover { opacity: 0.9; }
      button.secondary { background: transparent; color: var(--ink-soft); border-color: var(--line); }
      .row { display: flex; align-items: center; gap: 6px; }
      .companion-toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; margin: 0; }
      .companion-toggle input[type="checkbox"] { margin: 0; flex-shrink: 0; }
      .status { font-size: 12px; color: var(--ink-soft); }
      .status.ok { color: var(--ok); }
      .status.error { color: var(--error); }
      .mapping-row { padding: 6px 0; border-top: 1px solid var(--line); }
      .mapping-row:first-child { border-top: none; }
      .mapping-row .row + .row { margin-top: 3px; }
      .mapping-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; gap: 8px; }
      .hidden-tokens { margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
      .hidden-tokens summary, .settings summary { cursor: pointer; }
      .hidden-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0 3px 4px; }
      .settings { border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; }
      .settings summary { font-weight: 600; color: var(--brass); text-transform: uppercase; letter-spacing: .04em; }
      .set { margin-top: 8px; }
      .party-row { flex-wrap: wrap; margin: 4px 0 6px; }
      .party-row .status { flex-basis: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popover.ts"></script>
  </body>
</html>
