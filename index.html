<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiceCloud Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b222b;
        --ink-soft: #6b7280;
        --paper: #fbfcfc;
        --line: #d8dde0;
        --brass: #8f6526;
        --ok: #2f6b4a;
        --error: #8f3a26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--brass);
        margin: 0 0 6px;
      }
      .block {
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .block:last-child { border-bottom: none; }
      .hint { color: var(--ink-soft); margin: 0 0 8px; font-size: 12px; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
        background: white;
        color: var(--ink);
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--brass);
        background: var(--brass);
        color: white;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
      button.secondary {
        background: transparent;
        color: var(--ink-soft);
        border-color: var(--line);
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .status { font-size: 12px; color: var(--ink-soft); }
      .status.ok { color: var(--ok); }
      .status.error { color: var(--error); }
      .mapping-row {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .mapping-row:first-child { border-top: none; }
      .mapping-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
        gap: 8px;
      }
      .hidden-tokens {
        margin-top: 12px;
        font-size: 12px;
        color: var(--ink-soft);
      }
      .hidden-tokens summary { cursor: pointer; }
      .hidden-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 0 4px 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/popover.ts"></script>
  </body>
</html>
