<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abelon clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color-scheme: normal; }
      body { display: flex; justify-content: center; align-items: flex-start; padding-top: 2px; }
      .plate { display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 7px; border-radius: 22px; background: rgba(22,17,12,.88); border: 1px solid rgba(201,162,94,.45); box-shadow: 0 4px 12px rgba(0,0,0,.4); color: #efe3c8; opacity: 0; transition: opacity .8s ease; }
      .plate.on { opacity: 1; }
      .sky { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: inset 0 0 0 1px rgba(201,162,94,.5); transition: background 1.2s ease; }
      .orb { position: absolute; width: 12px; height: 12px; border-radius: 50%; left: 11px; transition: top 1.2s ease, background 1.2s ease, box-shadow 1.2s ease; }
      .when { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
      .part { font: 700 12px/1.15 Cinzel, Georgia, serif; letter-spacing: .1em; text-transform: uppercase; color: #f0d79b; }
      .part b { font-weight: 700; color: #efe3c8; margin-left: 6px; letter-spacing: .04em; }
      .date { font: italic 500 13px/1.2 "Crimson Pro", Georgia, serif; color: #c9b48a; }
    </style>
  </head>
  <body>
    <div class="plate" id="plate"><div class="sky" id="sky"><div class="orb" id="orb"></div></div><div class="when"><span class="part" id="part"></span><span class="date" id="date"></span></div></div>
    <script type="module" src="/src/clockView.ts"></script>
  </body>
</html>
