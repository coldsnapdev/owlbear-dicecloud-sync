<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abelon dice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color-scheme: dark; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { display: block; }
      #fade { position: absolute; inset: 0; transition: opacity .55s ease; }
      #fade.out { opacity: 0; }
      #hud {
        position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 14px); opacity: 0;
        min-width: 220px; max-width: 92%; padding: 9px 22px 11px; border-radius: 14px; text-align: center;
        background: linear-gradient(180deg, rgba(28,22,15,.86), rgba(18,14,10,.92));
        border: 1px solid rgba(201,162,94,.55); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,236,200,.08);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        transition: opacity .35s ease, transform .45s cubic-bezier(.2,.9,.25,1.2);
        font-family: "Crimson Pro", Georgia, serif; color: #efe3c8;
      }
      #hud.show { opacity: 1; transform: translate(-50%, 0); }
      #hud.crit { border-color: #f0c869; box-shadow: 0 0 26px rgba(240,200,105,.45), 0 10px 30px rgba(0,0,0,.45); }
      #hud.fumble { border-color: #c0614a; box-shadow: 0 0 22px rgba(192,97,74,.4), 0 10px 30px rgba(0,0,0,.45); }
      .who { font: 600 11px/1.2 Cinzel, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: #c9a25e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .results { display: flex; justify-content: center; align-items: baseline; gap: 18px; margin-top: 3px; flex-wrap: wrap; }
      .res { display: inline-flex; align-items: baseline; gap: 7px; }
      .res b { font: 700 34px/1 Cinzel, Georgia, serif; color: #fff4dc; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
      .res span { font-size: 16px; font-style: italic; color: var(--c, #d9c9a6); }
      .tag { margin-top: 2px; font: 700 12px/1.3 Cinzel, Georgia, serif; letter-spacing: .16em; text-transform: uppercase; }
      .crit .tag { color: #f0c869; }
      .fumble .tag { color: #e07a62; }
      .detail { margin-top: 3px; font-size: 13px; color: #a8987a; font-style: italic; }
    </style>
  </head>
  <body>
    <div id="fade">
      <div id="stage"></div>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/dice.ts"></script>
  </body>
</html>
