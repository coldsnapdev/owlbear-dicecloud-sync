<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM Panel — DiceCloud Sync</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b222b;
        --ink-soft: #6b7280;
        --paper: #fbfcfc;
        --line: #d8dde0;
        --brass: #8f6526;
        --ok: #2f6b4a;
        --warn: #8f3a26;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      h1 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--brass);
        margin: 0 0 4px;
      }
      .hint { color: var(--ink-soft); margin: 0 0 20px; font-size: 13px; }
      .hint.warn { color: var(--warn); }
      .toolbar { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
      .toolbar .hint { margin: 0; }
      button {
        padding: 7px 14px;
        border: 1px solid var(--brass);
        background: var(--brass);
        color: white;
        border-radius: 5px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button.secondary { background: transparent; color: var(--brass); padding: 4px 10px; font-size: 12px; }
      .roster { max-width: 860px; }
      .combatant { border: 1px solid var(--line); border-radius: 6px; background: white; margin-bottom: 8px; }
      .combatant .combatant-row { border: none; background: transparent; align-items: center; flex-wrap: wrap; }
      .alias { color: var(--ink-soft); font-weight: 400; font-size: 13px; }
      .pick { font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); max-width: 220px; }
      .block { padding: 4px 14px 12px 50px; border-top: 1px solid var(--line); }
      .block-stats { font-size: 13px; color: var(--ink-soft); margin: 8px 0; }
      .act { font-size: 14px; padding: 4px 0; }
      .hint.small { font-size: 12px; margin: 8px 0 0; }
      .settings { margin-top: 24px; max-width: 640px; }
      .layout { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
      #app { flex: 1 1 560px; min-width: 0; }
      aside { flex: 0 1 340px; position: sticky; top: 16px; }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--brass); margin: 0 0 8px; }
      .logline { font-size: 13px; padding: 6px 10px; border-left: 3px solid var(--line); margin-bottom: 4px; color: var(--ink-soft); }
      .logline.latest { color: var(--ink); border-left-color: var(--brass); font-size: 15px; }
      .logline.crit { border-left-color: var(--ok); }
      .logline.fumble { border-left-color: var(--warn); }
      .logline .who { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
      .chipwrap { white-space: nowrap; }
      .chip { font-size: 12px; padding: 1px 7px; margin: 0 2px; border-radius: 10px; }
      .chip.dmg { background: transparent; color: var(--brass); }
      .chip.mini { background: transparent; color: var(--ink-soft); border-color: var(--line); padding: 1px 5px; margin: 0 1px; }
      .res { font-size: 13px; margin-left: 4px; color: var(--ink); }
      .settings summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
      .settings input { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; background: transparent; color: var(--ink); }
      .roster { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
      .combatant-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }
      .init {
        font-size: 18px;
        font-weight: 600;
        color: var(--brass);
        min-width: 1.5em;
        text-align: right;
      }
      .name { font-weight: 600; flex: 1; }
      .stats { color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #e8eaed;
          --ink-soft: #9aa3ad;
          --paper: #14181d;
          --line: #2b323a;
        }
        .combatant-row { background: #1b222b; }
        .combatant { background: #1b222b; }
      }
    </style>
  </head>
  <body>
    <h1>Combat roster</h1>
    <div class="toolbar">
      <button id="update-roster" type="button">Update Roster</button>
      <span id="roster-meta" class="hint"></span>
    </div>
    <div class="layout">
      <div id="app"></div>
      <aside><h2>Rolls</h2><div id="roll-log"></div></aside>
    </div>
    <details class="settings">
      <summary>Settings</summary>
      <p class="hint">GitHub token (fine-grained, owlbear-dicecloud-sync repo, Contents: read and write), so stat block choices are saved for every device. Kept only in this browser.</p>
      <div class="toolbar">
        <input id="gh-token" type="password" autocomplete="off" />
        <button id="save-gh-token" type="button">Save token</button>
      </div>
      <p id="token-status" class="hint"></p>
    </details>
    <script type="module" src="/src/dm-panel.ts"></script>
  </body>
</html>
