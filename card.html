<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abelon scene</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; color-scheme: normal; }
      .card { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .card.play { animation: card var(--dur, 5.2s) ease-in-out forwards; }
      @keyframes card { 0% { opacity: 0; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
      .band { position: absolute; left: 0; right: 0; top: 50%; height: 260px; transform: translateY(-50%); background: radial-gradient(ellipse at center, rgba(14,10,6,.86) 0%, rgba(14,10,6,.6) 45%, rgba(14,10,6,0) 72%); }
      .inner { position: relative; text-align: center; padding: 0 24px; }
      .rule { width: min(420px, 60vw); height: 1px; margin: 0 auto; background: linear-gradient(90deg, transparent, #c9a25e, transparent); transform: scaleX(.2); }
      .play .rule { animation: rule 1.6s ease-out .4s forwards; }
      @keyframes rule { to { transform: scaleX(1); } }
      h1 { margin: 16px 0 10px; font: 700 clamp(28px, 4.6vw, 54px)/1.05 Cinzel, Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: #f0d79b; text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
      .play h1 { animation: rise 1.6s ease-out both; }
      p { margin: 0 0 16px; font: italic 500 clamp(15px, 1.9vw, 22px)/1.3 "Crimson Pro", Georgia, serif; letter-spacing: .04em; color: #e8d9bc; text-shadow: 0 1px 10px rgba(0,0,0,.9); }
      .play p { animation: rise 1.6s ease-out .35s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); letter-spacing: .3em; } to { opacity: 1; transform: none; } }
      .play p { letter-spacing: .04em; }
    </style>
  </head>
  <body>
    <div class="card" id="card"><div class="band"></div><div class="inner"><div class="rule"></div><h1 id="t"></h1><p id="s"></p><div class="rule"></div></div></div>
    <script type="module" src="/src/card.ts"></script>
  </body>
</html>
