<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abelon combat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      /* transparent over the map; keep the host's colour scheme or the browser paints a backdrop */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; color-scheme: normal; }
      body { font: 14px/1.2 "Crimson Pro", Georgia, serif; color: #efe3c8; }
      #strip { display: flex; align-items: flex-start; justify-content: center; gap: 6px; padding: 2px 6px 0; }
      .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        position: relative; flex: none; width: 124px; padding: 5px 7px 5px; border-radius: 9px;
        background: linear-gradient(180deg, rgba(34,27,19,.9), rgba(22,17,12,.9));
        border: 1px solid rgba(201,162,94,.35); border-top: 3px solid #c9a25e;
        box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: default; user-select: none;
        transition: transform .2s, box-shadow .2s, border-color .2s;
      }
      .chip.party { border-top-color: #5fb39b; }
      .gm .chip { cursor: pointer; }
      .chip.turn { border-color: #f0c869; transform: translateY(2px); box-shadow: 0 0 0 1px #f0c869 inset, 0 0 16px rgba(240,200,105,.45), 0 6px 14px rgba(0,0,0,.4); }
      .chip.turn::after { content: "Turn"; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font: 700 9px/1 Cinzel, serif; letter-spacing: .12em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: #f0c869; color: #1b140c; }
      .chip.hidden { opacity: .55; border-style: dashed; }
      .top { display: flex; align-items: center; gap: 6px; }
      .init { flex: none; min-width: 22px; height: 22px; padding: 0 3px; border-radius: 11px; display: grid; place-items: center; font: 700 12px/1 Cinzel, serif; color: #1b140c; background: #c9a25e; }
      .party .init { background: #5fb39b; }
      .init.none { background: rgba(255,255,255,.12); color: #c9b48a; }
      .init input { width: 32px; border: 0; border-radius: 6px; padding: 2px; font: 700 12px Cinzel, serif; text-align: center; background: #fff4dc; color: #1b140c; outline: none; }
      .name { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
      .hp { position: relative; height: 5px; margin: 5px 0 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
      .hp i { position: absolute; left: 0; top: 0; bottom: 0; background: #5fb36a; transition: width .4s ease; }
      .hp.mid i { background: #d9a441; }
      .hp.low i { background: #d05a43; }
      .hp b { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; background: #8fb6e8; }
      .meta { display: flex; justify-content: space-between; font-size: 12px; color: #cdbd99; min-height: 14px; }
      .meta .t { color: #8fb6e8; }
      .sts { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; }
      .sts span { font-size: 10px; line-height: 1; padding: 2px 4px; border-radius: 4px; color: #f4ead6; white-space: nowrap; }
      .sts span.dm { outline: 1px dashed rgba(255,255,255,.5); opacity: .8; }
      .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 4px; }
      .menu button, .ctl button { font: 600 11px/1 "Crimson Pro", serif; padding: 4px 4px; border-radius: 5px; border: 1px solid rgba(201,162,94,.5); background: rgba(201,162,94,.14); color: #efe3c8; cursor: pointer; }
      .menu button:hover, .ctl button:hover { background: rgba(201,162,94,.32); }
      .menu .x { grid-column: 1 / -1; opacity: .7; }
      .ctl { flex: none; display: flex; flex-direction: column; gap: 3px; padding: 4px 6px; border-radius: 9px; background: rgba(22,17,12,.88); border: 1px solid rgba(201,162,94,.35); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
      .ctl .round { font: 700 10px/1.2 Cinzel, serif; letter-spacing: .1em; text-transform: uppercase; color: #c9a25e; text-align: center; }
      .ctl .row { display: flex; gap: 3px; }
      .ctl .next { border-color: #f0c869; background: rgba(240,200,105,.25); }
      .ctl .armed { border-color: #e0533d; background: rgba(224,83,61,.35); }
      .round-pill { flex: none; align-self: center; font: 700 10px/1 Cinzel, serif; letter-spacing: .1em; text-transform: uppercase; color: #c9a25e; padding: 5px 7px; border-radius: 8px; background: rgba(22,17,12,.8); margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div id="strip"></div>
    <script type="module" src="/src/strip.ts"></script>
  </body>
</html>
